# Reference nginx server block for airtoolkit.ayoubedahlouli.com.
# This file is not loaded automatically — copy it into your VPS nginx config
# (e.g. /etc/nginx/sites-available/airtoolkit.conf, then symlink into
# sites-enabled/) and run `certbot --nginx` to provision TLS, or point it at
# your existing cert setup if you already run certbot for other subdomains.
#
# Assumes the airtoolkit container is reachable from the host as
# airtoolkit:3000 (see docker-compose.yml) — if nginx runs on the bare host
# rather than in the same Docker network, replace that with 127.0.0.1:<port>
# and publish the container's port instead of using `expose`.

server {
    listen 80;
    listen [::]:80;
    server_name airtoolkit.ayoubedahlouli.com;

    location / {
        proxy_pass http://airtoolkit:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
